{% macro offer_search(id, list_id, hint, label=none, stream_id=none) -%}
  <offer-picker{% if stream_id %} data-stream="{{ stream_id }}"{% endif %}>
    <input id="{{ id }}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="{{ list_id }}" {% if label %}aria-label="{{ label }}" {% endif %}placeholder="{{ hint }}" autocomplete="off" maxlength="100" required>
    <input type="hidden" name="offer_id">
    <div class="offer-popup" hidden>
      <div id="{{ list_id }}" role="listbox" aria-label="Найденные офферы"></div>
      <div role="status" class="offer-status"></div>
    </div>
  </offer-picker>
{%- endmacro %}
