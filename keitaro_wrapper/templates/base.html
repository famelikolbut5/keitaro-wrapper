<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true,"historyCacheSize":0}'>
  <title>Ink | Кампании Keitaro</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="{{ url_for('static', path='favicon.svg') }}">
  <script src="{{ url_for('static', path='theme-preference.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='workspace.css') }}">
  <link rel="modulepreload" href="{{ url_for('static', path='vendor/ink-theme.js') }}" fetchpriority="low" data-html2canvas-ignore>
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='workspace.js') }}" defer></script>
  <script src="{{ url_for('static', path='ink.js') }}" defer></script>
  <script src="{{ url_for('static', path='theme-controls.js') }}" type="module"></script>
</head>
<body>
  {% from 'icons.html' import icon %}
  <a class="button skip-link" href="#main-content" data-html2canvas-ignore>Перейти к содержимому</a>
  <header class="masthead">
    {% block brand %}{% endblock %}
    <div class="masthead-actions">
      <a class="quiet-link" href="/docs">Документация API {{ icon('external') }}</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Тёмная тема" aria-pressed="false" data-ink-live>
        <svg class="theme-toggle__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path class="theme-toggle__body" d="M12 7a5 5 0 1 1 0 10a5 5 0 1 1 0-10z"/>
          <g class="theme-toggle__rays">
            <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
          </g>
        </svg>
      </button>
    </div>
  </header>
  <main class="shell" id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
